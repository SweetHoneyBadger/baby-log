<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby log</title>
<meta name="theme-color" content="#4F4FC9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --ink:#1B1E2E; --muted:#5B6177; --line:#D8DCE7;
  --feed:#B87A0E; --feed-t:#FBEFD6; --diaper:#13857A; --diaper-t:#D8F1EE;
  --sleep:#4F4FC9; --sleep-t:#E3E3FA; --growth:#5F7A1F; --growth-t:#E8F0D4;
  --med:#B83232; --med-t:#F9DEDC; --note:#55627A; --note-t:#E2E6EE;
  --routine:#6C6390; --routine-t:#E9E6F3; --first:#A1407E; --first-t:#F5DDEC;
  --focus:#4F4FC9;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111326; --surface:#1B1E36; --ink:#ECEAF4; --muted:#A4A7C0; --line:#2D3152;
    --feed:#F0B44A; --feed-t:#3A2E17; --diaper:#4FD1C1; --diaper-t:#16332F;
    --sleep:#9C9CFF; --sleep-t:#25264D; --growth:#B3CF6A; --growth-t:#273019;
    --med:#FF8A80; --med-t:#3B1E1E; --note:#AEB8CC; --note-t:#262B3A;
    --routine:#BBB2E0; --routine-t:#2A2740; --first:#F08BCB; --first-t:#3A1F33;
    --focus:#9C9CFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111326; --surface:#1B1E36; --ink:#ECEAF4; --muted:#A4A7C0; --line:#2D3152;
  --feed:#F0B44A; --feed-t:#3A2E17; --diaper:#4FD1C1; --diaper-t:#16332F;
  --sleep:#9C9CFF; --sleep-t:#25264D; --growth:#B3CF6A; --growth-t:#273019;
  --med:#FF8A80; --med-t:#3B1E1E; --note:#AEB8CC; --note-t:#262B3A;
  --routine:#BBB2E0; --routine-t:#2A2740; --first:#F08BCB; --first-t:#3A1F33;
  --focus:#9C9CFF; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.who h1{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.1;margin:0}
.who p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;font-size:1.1rem;flex:none}
nav.views{margin:12px 0 0}
.hero{padding:22px 0 18px}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(3.4rem,17vw,5.2rem);line-height:.92;letter-spacing:-.03em;color:var(--feed);font-variant-numeric:tabular-nums}
.hero .big.empty{font-size:2rem;color:var(--muted);letter-spacing:0;line-height:1.2}
.hero .lead{margin:8px 0 0;font-size:1.05rem}
.hero .lead span{color:var(--muted)}
.since{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.since div{border-left:3px solid var(--c);padding:2px 0 2px 10px}
.since b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.since small{color:var(--muted);font-size:.9rem}
.timerbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--c-t);border:1.5px solid var(--c);border-radius:16px;padding:12px 14px;margin:10px 0 4px}
.timerbar .lbl{flex:1 1 140px}
.timerbar .lbl strong{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.timerbar .lbl span{color:var(--muted);font-size:.92rem}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg);min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--surface);color:var(--ink)}
.btn.danger{background:transparent;color:var(--med);border:1.5px solid var(--med)}
.btn.wide{width:100%}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 26px}
.quick button{display:flex;align-items:center;gap:12px;text-align:left;border:0;cursor:pointer;background:var(--c-t);border-radius:18px;padding:14px;min-height:72px}
.quick button .ic{font-size:1.5rem;line-height:1}
.quick button b{display:block;font-family:var(--display);font-size:1.12rem}
.quick button small{color:var(--muted);font-size:.84rem;line-height:1.3;display:block}
.t-feed{--c:var(--feed);--c-t:var(--feed-t)} .t-diaper{--c:var(--diaper);--c-t:var(--diaper-t)}
.t-sleep{--c:var(--sleep);--c-t:var(--sleep-t)} .t-growth{--c:var(--growth);--c-t:var(--growth-t)}
.t-med{--c:var(--med);--c-t:var(--med-t)} .t-note{--c:var(--note);--c-t:var(--note-t)}
.t-routine{--c:var(--routine);--c-t:var(--routine-t)} .t-first{--c:var(--first);--c-t:var(--first-t)}
h2{font-family:var(--display);font-size:1.25rem;margin:0 0 10px}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.h2row h2{margin:0}
.today{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.today div{background:var(--surface);border-radius:14px;padding:12px 10px}
.today b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums;line-height:1.2}
.today small{color:var(--muted);font-size:.82rem;line-height:1.3;display:block}
@media (max-width:380px){.today{grid-template-columns:1fr 1fr}}
.streaks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.streaks span{background:var(--routine-t);border-radius:999px;padding:6px 12px;font-size:.92rem}
.streaks b{font-family:var(--display)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.95rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{margin-bottom:18px}
.day h3{font-size:.95rem;color:var(--muted);font-weight:700;margin:0 0 6px}
.entry{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:0;border-radius:14px;padding:12px 14px;margin-bottom:6px;cursor:pointer}
.entry .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:8px;flex:none}
.entry .tm{min-width:4.6em;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem;padding-top:1px}
.entry .tx{flex:1}
.entry .tx small{display:block;color:var(--muted);font-size:.9rem}
.empty-state{background:var(--surface);border-radius:14px;padding:18px;color:var(--muted);margin-bottom:12px}
.more{display:block;margin:6px auto 0}
.chart{background:var(--surface);border-radius:16px;padding:14px 12px 8px;margin-bottom:12px}
.chart h3{margin:0 0 2px 4px;font-family:var(--display);font-size:1.05rem}
.chart p{margin:0 0 6px 4px;color:var(--muted);font-size:.9rem}
.chart svg{width:100%;height:auto;display:block}
.firsts{list-style:none;margin:0;padding:0}
.firsts li{margin:0 0 10px}
.firsts button{width:100%;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:16px;cursor:pointer;border-left:5px solid var(--first)}
.firsts b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.2}
.firsts small{color:var(--muted);display:block}
.firsts p{margin:6px 0 0}
.firsts img{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-top:10px;background:var(--first-t)}
.firsts img:not([src]){height:120px}
.pv{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-bottom:8px}
.photo{margin-bottom:14px}
.rt{background:var(--bg);border-radius:14px;padding:12px 12px 2px;margin-bottom:10px}
.rt .field input{background:var(--surface)}
.rt-head{display:flex;gap:8px;align-items:flex-end}
.rt-head .field{flex:1}
.rt-head .iconbtn{margin-bottom:14px}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:92dvh;margin:auto auto 0;border-radius:22px 22px 0 0;overflow:auto}
dialog::backdrop{background:rgba(10,12,28,.5)}
@media (min-width:640px){dialog{margin:auto;border-radius:22px}}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:1.45rem}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;cursor:pointer;font-weight:700;color:var(--muted);min-height:42px;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lbl{display:block;font-weight:700;font-size:.92rem;margin-bottom:5px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:700;font-size:.92rem;margin-bottom:5px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;min-height:46px}
.field textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.or{color:var(--muted);text-align:center;margin:14px 0;font-size:.92rem}
.bigchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.bigchoices button{border:1.5px solid var(--c);background:var(--c-t);border-radius:16px;padding:16px 6px;cursor:pointer;font-weight:700;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bigchoices button .ic{font-size:1.5rem}
.bigchoices button[aria-pressed="true"]{outline:3px solid var(--c);outline-offset:1px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.toggles button{border:1.5px solid var(--c);background:transparent;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700;min-height:44px}
.toggles button[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.toggles.small button{font-weight:400;padding:7px 12px;min-height:38px;font-size:.92rem;border-color:var(--line)}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.hint{color:var(--muted);font-size:.9rem;margin:-6px 0 14px}
.divider{border:0;border-top:1px solid var(--line);margin:22px 0 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:.85rem;text-align:center;margin-top:26px}
:root[data-palette="sage"][data-theme="light"]{--bg:#EAF0EA;--surface:#FFFFFF;--ink:#1A251D;--muted:#56665A;--line:#D2DDD3;--focus:#2F7A4F}
:root[data-palette="sage"][data-theme="dark"]{--bg:#0F1A14;--surface:#18261E;--ink:#E7F0E9;--muted:#9FB3A5;--line:#284034;--focus:#7FD1A0}
:root[data-palette="blush"][data-theme="light"]{--bg:#F7ECEF;--surface:#FFFFFF;--ink:#2A1A20;--muted:#6E5660;--line:#EBD4DC;--focus:#B23D6C}
:root[data-palette="blush"][data-theme="dark"]{--bg:#1F1218;--surface:#2B1A22;--ink:#F6E9EE;--muted:#C2A5B1;--line:#45293A;--focus:#F27FAD}
:root[data-palette="ocean"][data-theme="light"]{--bg:#E9F1F7;--surface:#FFFFFF;--ink:#142231;--muted:#506477;--line:#CFDDEA;--focus:#1F6FB2}
:root[data-palette="ocean"][data-theme="dark"]{--bg:#0B1622;--surface:#132234;--ink:#E6EEF6;--muted:#9AB0C5;--line:#22384F;--focus:#6CB4F0}
:root[data-palette="midnight"][data-theme="light"]{--bg:#F2F2F4;--surface:#FFFFFF;--ink:#16161A;--muted:#5E5E68;--line:#DEDEE3;--focus:#16161A}
:root[data-palette="midnight"][data-theme="dark"]{--bg:#000000;--surface:#121214;--ink:#F2F2F4;--muted:#9A9AA3;--line:#26262B;--focus:#C9C9D1}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:6px}
.swatches button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.9rem;min-height:44px}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset;font-weight:700}
.swatches i{width:30px;height:30px;border-radius:50%;display:block;border:1px solid rgba(128,128,128,.35)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px;font-size:.95rem}
.code{font-family:var(--display);font-size:2.2rem;font-weight:700;letter-spacing:.12em;text-align:center;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.toggles.kids{margin:10px 0 0}
.toggles.kids button{border-color:var(--line)}
.toggles.kids button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading your log…</div></div>
<dialog id="sheet" aria-label="Log entry"><div class="sheet" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
